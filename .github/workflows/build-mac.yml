name: build-mac
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ytf/target
          key: mac-ytf-${{ hashFiles('ytf/Cargo.lock') }}

      - name: Build
        working-directory: ytf
        run: cargo build --release

      - name: Prepare artifact
        run: |
          mkdir -p out
          cp ytf/target/release/ytf out/ytf-macos
          file out/ytf-macos || true
          chmod +x out/ytf-macos

      - uses: actions/upload-artifact@v4
        with:
          name: ytf-macos
          path: out/ytf-macos
